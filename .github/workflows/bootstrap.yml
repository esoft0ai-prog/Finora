name: Bootstrap Finora source
on:
  push:
    paths:
      - "_bootstrap/READY"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/part-* > /tmp/finora.b64
          base64 --decode /tmp/finora.b64 > /tmp/finora-source.zip
          mkdir -p /tmp/finora-src
          unzip -q /tmp/finora-source.zip -d /tmp/finora-src
      - name: Import project tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github/workflows/bootstrap.yml" \
            --exclude "_bootstrap" \
            /tmp/finora-src/Finora/ ./
          rm -rf _bootstrap
      - name: Commit complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: import complete Finora source"
            git push
          fi
